<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StillHere — Presence</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box reveal active">
            <div class="auth-header">
                <span class="logo-icon material-symbols-outlined">spa</span>
                <h1>Still<span class="accent">Here</span></h1>
                <p id="auth-subtitle">Welcome back to the quiet.</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="primary-btn wide">Sign In</button>
                <p class="auth-switch">New here? <a href="#" id="show-signup">Enter the quiet</a></p>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form hidden" onsubmit="return false;">
                <!-- Step 1: Account details -->
                <div id="signup-step-1" class="signup-step">
                    <div class="input-group">
                        <input type="text" id="signup-username" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <input type="email" id="signup-email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="signup-password" placeholder="Password" required>
                    </div>
                    <button type="button" class="primary-btn wide" id="signup-next-btn">Continue</button>
                    <p class="auth-switch">Already with us? <a href="#" id="show-login">Login</a></p>
                </div>

                <!-- Step 2: Customization (Initially hidden) -->
                <div id="signup-step-2" class="signup-step hidden">
                    <div class="input-group" style="text-align: left; margin-bottom: 15px;">
                        <label
                            style="font-size: 13px; font-weight: 500; opacity: 0.8; margin-bottom: 5px; display: block; color: var(--text-primary);">Language</label>
                        <input type="text" id="signup-languages" list="languages-list" placeholder="Choose language..."
                            required value="English">
                        <datalist id="languages-list">
                            <option value="English">English</option>
                            <option value="Korean">Korean</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Chinese">Chinese</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                            <option value="Italian">Italian</option>
                            <option value="Russian">Russian</option>
                            <option value="Portuguese">Portuguese</option>
                            <option value="Hindi">Hindi</option>
                            <option value="Arabic">Arabic</option>
                            <option value="Turkish">Turkish</option>
                            <option value="Vietnamese">Vietnamese</option>
                            <option value="Dutch">Dutch</option>
                            <option value="Polish">Polish</option>
                            <option value="Swedish">Swedish</option>
                        </datalist>
                    </div>

                    <div style="display: flex; gap: 15px; text-align: left; margin-bottom: 20px;">
                        <div style="flex: 1;">
                            <label
                                style="font-size: 13px; font-weight: 500; opacity: 0.8; margin-bottom: 5px; display: block; color: var(--text-primary);">Avatar
                                Emoji</label>
                            <select id="signup-avatar"
                                style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--text-primary); font-family: 'Inter'; font-size: 14px; cursor: pointer;">
                                <option value="🦊">🦊 Fox</option>
                                <option value="🐰">🐰 Rabbit</option>
                                <option value="🦁">🦁 Lion</option>
                                <option value="🐢">🐢 Turtle</option>
                                <option value="🕊️">🕊️ Bird</option>
                                <option value="🌿">🌿 Leaf</option>
                                <option value="🌙">🌙 Moon</option>
                                <option value="🌊">🌊 Wave</option>
                                <option value="🕯️">🕯️ Candle</option>
                                <option value="🌸" selected>🌸 Flower</option>
                                <option value="✨">✨ Sparkles</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label
                                style="font-size: 13px; font-weight: 500; opacity: 0.8; margin-bottom: 5px; display: block; color: var(--text-primary);">Theme
                                Color</label>
                            <input type="color" id="signup-color" value="#39b59e"
                                style="width: 100%; height: 45px; background: none; border: none; cursor: pointer; padding: 0;" />
                        </div>
                    </div>

                    <button type="submit" class="primary-btn wide" id="signup-submit-btn">Start Presence</button>
                    <p class="auth-switch"><a href="#" id="signup-back-btn" style="opacity: 0.6;">← Back to details</a>
                    </p>
                </div>
            </form>

            <div id="auth-message" class="auth-message hidden"></div>
        </div>
    </div>

    <!-- Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <script src="config.js?v=1.0.1"></script>
    <script src="auth.js?v=1.0.1"></script>
</body>

</html>
