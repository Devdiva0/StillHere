<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room — StillHere</title>

    <meta name="description" content="Quiet voice rooms for presence, not performance." />

    <!-- Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Icons (Google Material Symbols) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />

    <link rel="stylesheet" href="global.css?v=1.0.1" />
    <link rel="stylesheet" href="room.css?v=1.0.1" />
</head>

<body class="room-fullscreen-body">

    <!-- Room Fullscreen Main -->
    <div class="room-fullscreen-container">
        <div class="room-page-content">
            <!-- App-like Room Header -->
            <div class="room-header">
                <div style="width: 70px;"></div> <!-- Flex spacer -->
                <div class="room-brand" id="modal-table-title">Digital Burnout</div>
                <div class="header-actions">
                    <button class="chat-toggle-btn" onclick="toggleChat()"
                        style="display: flex; align-items: center; gap: 6px;">
                        <span class="material-symbols-outlined" style="font-size: 20px;">chat</span>
                        Chat
                    </button>
                </div> <!-- Flex spacer / actions -->
            </div>

            <div class="room-main-area">
                <!-- Left Side: Speaker & Listener Board -->
                <div class="room-body">
                    <p class="room-host" style="margin-bottom: 20px;">Hosted by <strong
                            id="modal-table-host">Alice</strong></p>

                    <div class="room-layout">
                        <div class="speaker-grid">
                            <!-- Dynamic speakers will load here -->
                        </div>
                    </div>

                    <div class="listeners-section">
                        <h3>Listen only</h3>
                        <div class="listener-scroll">
                            <div class="listener-item invite-btn" style="cursor: pointer;" onclick="inviteOthers()">
                                <div class="listener-avatar invite-avatar">
                                    +
                                </div>
                                <div class="listener-name">Invite</div>
                                <div class="listener-lang" style="opacity:0">-</div>
                            </div>
                            <!-- Dynamic listeners will load here -->
                        </div>
                    </div>

                    <!-- Room Bottom Controls -->
                    <div class="room-bottom-controls">
                        <button class="control-btn icon-btn mute-btn" id="mic-toggle-btn" onclick="toggleMic()"
                            title="Turn off microphone">
                            <span class="material-symbols-outlined ctrl-icon">mic</span>
                        </button>
                        <button class="control-btn leave-room-btn" id="leave-room-action-btn" onclick="leaveOrEndRoom()"
                            title="Leave room">
                            <span class="material-symbols-outlined ctrl-icon">call_end</span> Leave
                        </button>
                    </div>
                </div>

                <!-- Right Side: Chat Panel -->
                <div class="chat-panel" id="chat-panel">
                    <div class="chat-header">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <h3>Room Chat</h3>
                            <span class="chat-count">12 online</span>
                        </div>
                        <button class="close-chat-btn" onclick="toggleChat()">✕</button>
                    </div>

                    <div class="chat-messages" id="chat-messages">
                        <div class="message system-message">
                            You joined the room. Welcome to the space.
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Whisper something..."
                            onkeydown="if(event.key==='Enter') sendChatMessage()">
                        <button class="chat-send-btn" onclick="sendChatMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="socket.io.js?v=1.0.1"></script>
        <script src="config.js?v=1.0.1"></script>
        <script src="script.js?v=1.0.1"></script>
</body>

</html>
